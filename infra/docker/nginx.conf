server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    include /etc/nginx/snippets/security-headers.conf;

    # Hashed build output: the filename changes when the content does, so it
    # can be cached forever.
    location ^~ /assets/ {   # ^~ so the extension rule below does not take these over
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;   # a missing chunk is a 404, not index.html served as JavaScript
    }

    # Icons, themes and other unhashed static files.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|js|css)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Web app manifest (installable iPhone/Android app)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # The page itself must always be revalidated: it names the current hashed
    # bundle, so a cached copy keeps a tab on an old release (and old code).
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
