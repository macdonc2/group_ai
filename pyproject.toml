[project]
name = "agent-system"
version = "0.1.0"
description = "Hexagonal architecture agentic reasoning system with PydanticAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-ai>=0.0.39",
    "pydantic-graph>=0.0.39",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "neo4j>=5.27.0",
    "fastapi>=0.115.6",
    "fastapi-users[sqlalchemy]>=14.0.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.1",
    "cryptography>=42.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.1.3",
    "asyncpg>=0.30.0",
    "ddgs>=6.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "dateparser>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",
    "testcontainers[neo4j]>=4.9.0",
    "mypy>=1.14.1",
    "ruff>=0.9.2",
    "black>=24.10.0",
    "isort>=5.13.2",
    "pre-commit>=4.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_system"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --maxfail=3"
markers = [
    "unit: Unit tests (fast, no I/O)",
    "contract: Contract tests for port implementations",
    "integration: Integration tests with real adapters",
    "e2e: End-to-end API tests",
    "slow: Slow running tests",
]
filterwarnings = [
    "error::DeprecationWarning",
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/agent_system"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT", "SIM"]
ignore = ["E501"]

[tool.isort]
profile = "black"
line_length = 100

[tool.black]
line-length = 100
target-version = ["py311"]
