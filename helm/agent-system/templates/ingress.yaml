{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agent-system.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agent-system.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # API routes go to backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "agent-system.fullname" . }}-backend
                port:
                  number: {{ .Values.service.backend.port }}
          # Health check endpoint
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: {{ include "agent-system.fullname" . }}-backend
                port:
                  number: {{ .Values.service.backend.port }}
          # OpenAPI docs
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: {{ include "agent-system.fullname" . }}-backend
                port:
                  number: {{ .Values.service.backend.port }}
          - path: /redoc
            pathType: Prefix
            backend:
              service:
                name: {{ include "agent-system.fullname" . }}-backend
                port:
                  number: {{ .Values.service.backend.port }}
          # Everything else goes to frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "agent-system.fullname" . }}-frontend
                port:
                  number: {{ .Values.service.frontend.port }}
{{- end }}
