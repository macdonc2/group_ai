{{- if .Values.networkPolicy.enabled }}
# Who may talk to whom inside the namespace. Without these, any pod in the
# cluster can open a connection to Postgres or Neo4j.
#
#   internet -> ingress controller -> frontend :8080
#                                  -> backend  :8000 -> postgres :5432
#                                                    -> neo4j    :7687
#                                                    -> internet (model APIs, web reading)
---
# Start from nothing: no pod in this namespace accepts connections...
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-system.fullname" . }}-default-deny
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# ...then the ingress controller may reach the two web-facing pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-system.fullname" . }}-web-from-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: [backend, frontend] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - { protocol: TCP, port: {{ .Values.backend.port }} }
        - { protocol: TCP, port: {{ .Values.frontend.port }} }
---
# Only the backend may reach the data stores.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-system.fullname" . }}-data-from-backend
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: NotIn, values: [backend, frontend] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "agent-system.backend.selectorLabels" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 7687 }
---
# The frontend serves static files and needs to call nothing (DNS aside).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-system.fullname" . }}-frontend-no-egress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent-system.frontend.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- end }}
